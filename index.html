<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple, responsive calculator built with HTML, CSS and JavaScript.">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="calculator" aria-label="Basic calculator">
    <header class="calculator__header">
      <p class="eyebrow">EVERYDAY TOOLS</p>
      <h1>Calculator</h1>
      <p class="subtitle">Simple calculations, no distractions.</p>
    </header>

    <section class="calculator__screen" aria-label="Calculator display">
      <div id="previous-operand" class="previous-operand" aria-live="polite"></div>
      <output id="current-operand" class="current-operand" aria-live="polite">0</output>
    </section>

    <section class="keys" aria-label="Calculator keys">
      <button class="key key--utility" data-action="clear" type="button">AC</button>
      <button class="key key--utility" data-action="delete" type="button" aria-label="Delete last digit">DEL</button>
      <button class="key key--operator" data-operator="÷" type="button" aria-label="Divide">÷</button>
      <button class="key key--operator" data-operator="×" type="button" aria-label="Multiply">×</button>

      <button class="key" data-number="7" type="button">7</button>
      <button class="key" data-number="8" type="button">8</button>
      <button class="key" data-number="9" type="button">9</button>
      <button class="key key--operator" data-operator="−" type="button" aria-label="Subtract">−</button>

      <button class="key" data-number="4" type="button">4</button>
      <button class="key" data-number="5" type="button">5</button>
      <button class="key" data-number="6" type="button">6</button>
      <button class="key key--operator" data-operator="+" type="button">+</button>

      <button class="key" data-number="1" type="button">1</button>
      <button class="key" data-number="2" type="button">2</button>
      <button class="key" data-number="3" type="button">3</button>
      <button class="key key--equals" data-action="equals" type="button">=</button>

      <button class="key key--zero" data-number="0" type="button">0</button>
      <button class="key" data-action="decimal" type="button">.</button>
    </section>
    <footer class="calculator__footer">CALCULATOR</footer>
  </main>
</body>
</html>
